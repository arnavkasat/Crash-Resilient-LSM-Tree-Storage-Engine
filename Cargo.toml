[package]
name = "lsmkv"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A crash-resilient LSM-tree key-value storage engine"
license = "MIT"
readme = "README.md"

[dependencies]

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "engine"
harness = false

[profile.release]
debug = 1

[profile.bench]
debug = 1
