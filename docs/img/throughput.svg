<svg xmlns="http://www.w3.org/2000/svg" width="900" height="402" viewBox="0 0 900 402" role="img">
  <style>
    .bg    { fill: #f6f8fa; stroke: #d0d7de; }
    .title { fill: #1f2328; font: 600 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .sub   { fill: #656d76; font: 400 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .label { fill: #1f2328; font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .value { fill: #1f2328; font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .axis  { fill: #656d76; font: 400 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .grid  { stroke: #d8dee4; stroke-width: 1; }
    .zero  { stroke: #8c959f; stroke-width: 1.5; }
    .big   { fill: #1f2328; font: 700 38px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; stroke: #30363d; }
      .title, .label, .value, .big { fill: #e6edf3; }
      .sub, .axis { fill: #8b949e; }
      .grid  { stroke: #21262d; }
      .zero  { stroke: #6e7681; }
    }
  </style>
<rect class="bg" x="0.5" y="0.5" width="899" height="401" rx="8"/><text class="title" x="22" y="32">lsmkv throughput</text><text class="sub" x="22" y="54">4-vCPU Linux cloud container, virtio disk, ext4 - 17-byte keys, 100-byte values</text><line class="grid" x1="290.0" y1="62" x2="290.0" y2="346"/><text class="axis" x="290.0" y="366" text-anchor="middle">1K</text><line class="grid" x1="445.7" y1="62" x2="445.7" y2="346"/><text class="axis" x="445.7" y="366" text-anchor="middle">10K</text><line class="grid" x1="601.4" y1="62" x2="601.4" y2="346"/><text class="axis" x="601.4" y="366" text-anchor="middle">100K</text><line class="grid" x1="757.1" y1="62" x2="757.1" y2="346"/><text class="axis" x="757.1" y="366" text-anchor="middle">1M</text><text class="label" x="278" y="92" text-anchor="end">Writes, buffered log, 3M keys</text><rect x="290" y="79" width="393.8" height="18" rx="3" fill="#2f81f7"/><text class="value" x="692.8" y="93">337.9K</text><text class="label" x="278" y="126" text-anchor="end">Writes, random order, 20M keys</text><rect x="290" y="113" width="331.1" height="18" rx="3" fill="#2f81f7"/><text class="value" x="630.1" y="127">133.7K</text><text class="label" x="278" y="160" text-anchor="end">Writes, fsync each, batches of 100</text><rect x="290" y="147" width="372.9" height="18" rx="3" fill="#8957e5"/><text class="value" x="671.9" y="161">248.3K</text><text class="label" x="278" y="194" text-anchor="end">Writes, fsync each, one at a time</text><rect x="290" y="181" width="118.9" height="18" rx="3" fill="#8957e5"/><text class="value" x="417.9" y="195">5.8K</text><text class="label" x="278" y="228" text-anchor="end">Reads, 3M keys, uniform</text><rect x="290" y="215" width="310.9" height="18" rx="3" fill="#2ea043"/><text class="value" x="609.9" y="229">99.2K</text><text class="label" x="278" y="262" text-anchor="end">Reads, 20M keys, uniform</text><rect x="290" y="249" width="283.0" height="18" rx="3" fill="#2ea043"/><text class="value" x="582.0" y="263">65.7K</text><text class="label" x="278" y="296" text-anchor="end">Reads, 20M keys, hot 10%</text><rect x="290" y="283" width="344.4" height="18" rx="3" fill="#2ea043"/><text class="value" x="643.4" y="297">162.8K</text><text class="label" x="278" y="330" text-anchor="end">Reads, 3M keys, all misses</text><rect x="290" y="317" width="518.0" height="18" rx="3" fill="#2ea043"/><text class="value" x="817.0" y="331">2122.3K</text><text class="axis" x="547" y="392" text-anchor="middle">operations per second (log scale)</text></svg>
